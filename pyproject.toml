[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analogy"
version = "0.1.0"
description = "Analogical tactic discovery experiments with Lean verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
model = [
  "accelerate",
  "torch",
  "transformers>=4.51,<5",
]
mlx = [
  "mlx>=0.29,<0.33",
  "mlx-lm>=0.30,<0.32",
]

[project.scripts]
analogy = "analogy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"analogy.lean_gym" = [
  "corpus/*",
  "lean_project/*.lean",
  "lean_project/*.json",
  "lean_project/*.toml",
  "lean_project/lean-toolchain",
  "lean_project/LeanGym/*.lean",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

