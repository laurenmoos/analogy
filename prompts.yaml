prompts:
  conventional_ranker:
    version: conventional-ranker-v4
    system: >-
      Rank next Lean 4 tactics. JSON only: a nonempty array of objects with exactly `tactic` and `score`.
      Tactics are one-line strings; scores are nonnegative numbers. Use visible identifiers only. Never repeat
      a current-state failure; earlier-state failures are diagnostic context, not a global blacklist.
    user: |-
      Overall target:
      {{overall_target}}
      Current goals:
      {{current_goals}}
      Accepted prefix:
      {{accepted}}
      Recent path failure feedback:
      {{failed}}
      {{tactic_card}}
      Return at most {{top_k}} candidates.

  analogy_conventional_ranker:
    version: analogy-conventional-ranker-v1
    system: >-
      Rank next Lean 4 tactics while maintaining the external analogy scratchpad. Return exactly one
      <analogy> block followed by a nonempty JSON array of objects with exactly `tactic` and `score`.
      Tactics are one-line strings; scores are nonnegative numbers. Use visible identifiers only. Never repeat
      a current-state failure; earlier-state failures are diagnostic context, not a global blacklist.
    user: |-
      Overall target:
      {{overall_target}}
      Current goals:
      {{current_goals}}
      Accepted prefix:
      {{accepted}}
      Recent path failure feedback:
      {{failed}}
      {{tactic_card}}
      If no current analogy block was supplied, create one with domain, mapping, numbered steps, and abandoned domains.
      If a current analogy block was supplied, repeat it unchanged; ordinary search must not revise it.
      Then return at most {{top_k}} candidates after the block.

  analogy_initialize:
    version: analogy-initialize-v1
    system: >-
      Create one concrete analogy for planning this Lean 4 proof. Return exactly one <analogy> block
      with domain, mapping, numbered steps, and abandoned domains, with no text before or after it.
    user: |-
      Overall target:
      {{overall_target}}

      Current goals:
      {{current_goals}}

      Do not use any of these already selected domains:
      {{excluded_domains}}

      Return exactly one <analogy> block and no text before or after it.

  analogy_rescue:
    version: analogy-rescue-v9
    system: >-
      Use one concrete analogy to escape this Lean 4 proof state, then return one tactic. Lean is the judge.
      JSON only.
    user: |-
      Overall target:
      {{overall_target}}

      Current goals:
      {{current_goals}}

      Semantic recovery:
      {{semantic_guidance}}

      Dependency evidence (may be absent):
      {{dependency_table}}

      Accepted prefix:
      {{accepted}}

      OPEN tactics (Lean accepted and left goals):
      {{open_tactics}}

      REJECTED tactics (Lean errors or unusable results):
      {{rejected_tactics}}

      {{tactic_card}}

      Return exactly "analogy", "predicted_state", and "tactic". When dependency evidence is present,
      account for it explicitly in the analogy mapping.
      predicted_state must be literal SOLVED or the exact full focused Lean state expected immediately after the tactic,
      including its visible context and goal. Never predict the unchanged current state. tactic is one complete Lean 4 line;
      use ; or <;> to sequence.

  analogy_update:
    version: analogy-update-v2
    system: >-
      Update the external analogy scratchpad to escape this stuck Lean 4 proof state, then return the first tactic
      from the updated story. Lean is the judge. Return exactly one <analogy> block followed by JSON only.
    user: |-
      Overall target:
      {{overall_target}}

      Current goals:
      {{current_goals}}

      Semantic recovery:
      {{semantic_guidance}}

      Dependency evidence (may be absent):
      {{dependency_table}}

      Accepted prefix:
      {{accepted}}

      OPEN tactics (Lean accepted and left goals):
      {{open_tactics}}

      REJECTED tactics (Lean errors or unusable results):
      {{rejected_tactics}}

      {{tactic_card}}

      Choose action revise_steps or change_domain. revise_steps must keep the supplied domain and mapping exactly
      and change only the numbered steps. change_domain must choose a new domain not listed under abandoned domains,
      with a new mapping and numbered story. A SAT restart/countermodel requires change_domain.
      Return the updated <analogy> block, then JSON with exactly "action", "predicted_state", and "tactic".
      predicted_state is literal SOLVED or the exact full focused Lean state expected immediately after the first tactic.

  lean_tactic_card:
    version: lean-tactic-card-v2
    text: >-
      Lean card: complete line; no tauto/itauto. {{recipes}}Core moves: intro, exact <hyp>, apply <hyp>, constructor,
      cases/rcases, False.elim. Also use assumption or rw [<hyp>] when justified by the state.

  lean_tactic_card_recipes:
    version: lean-tactic-card-recipes-v1
    text: 'Destruct/introduce: {{recipes}}. '

  proof_search_history:
    version: proof-search-history-v1
    text: |-
      Proof search history (analogy blocks removed):
      {{history}}

  ranker_json_output_contract:
    version: ranker-json-output-contract-v1
    text: 'Return only the requested JSON array.'

  ranker_analogy_output_contract:
    version: ranker-analogy-output-contract-v1
    text: 'Return the current <analogy> block unchanged, followed by the requested JSON array.'

  ranker_replacement_repair:
    version: ranker-replacement-repair-v1
    text: |-
      These proposals were removed before Lean:
      - {{discarded}}
      Return replacement candidates only. Do not repeat any removed or already tried tactic. Supply every operand,
      for example `exact h2`, `apply h1`, `rw [h1]`, or `rcases h with ⟨hH,hU⟩`. {{contract}}

  analogy_rescue_output_contract:
    version: analogy-rescue-output-contract-v1
    text: 'Return only strict JSON with exactly "analogy", "predicted_state", and singular "tactic".'

  analogy_update_output_contract:
    version: analogy-update-output-contract-v1
    text: >-
      Return one updated <analogy> block followed by strict JSON with exactly "action", "predicted_state", and "tactic".

  analogy_duplicate_repair:
    version: analogy-duplicate-repair-v1
    text: |-
      The previous tactic was valid but already tried at this proof state. Return a different tactic.

      Tactics already tried here: {{tried_tactics}}

      Duplicate diagnostic:
      {{diagnostic}}

      Previous response (analogy block removed):
      {{previous_response}}

      {{contract}}

  analogy_invalid_repair:
    version: analogy-invalid-repair-v1
    text: |-
      The previous response was invalid.

      Parser diagnostic:
      {{diagnostic}}

      Previous response (analogy block removed):
      {{previous_response}}

      {{contract}}

  analogy_no_change_repair:
    version: analogy-no-change-repair-v1
    text: |-
      The previous response predicted no state change, so it was not sent to Lean. Return a tactic with a different immediate state prediction.

      Tactics already tried here: {{tried_tactics}}

      {{contract}}

  analogy_lean_correction_repair:
    version: analogy-lean-correction-repair-v1
    text: |-
      The previous tactic did not make usable progress.
      Tactic: {{tactic}}
      Lean diagnostic: {{diagnostic}}
      Return a different complete tactic as the required strict JSON object.
      {{contract}}

  analogy_search_correction_repair:
    version: analogy-search-correction-repair-v1
    text: |-
      The previous tactic did not make usable progress.
      Tactic: {{tactic}}
      Search diagnostic: accepted but discarded: {{reason}}
      Return a different complete tactic as the required strict JSON object.
      {{contract}}

  analogy_missing_lean_diagnostic:
    version: analogy-missing-lean-diagnostic-v1
    text: 'Lean rejected the tactic'

  analogy_pending_context:
    version: analogy-pending-context-v1
    text: |-
      <analogy>
      active: (none; change_domain required)
      abandoned domains:
      {{abandoned_domains}}
      </analogy>

  negation_definition:
    version: negation-definition-v1
    text: '{{prefix}}¬{{body}}  [definitionally: {{body}} → False]'

  semantic_valid_guidance:
    version: semantic-valid-guidance-v1
    text: 'SAT: no countermodel; continue from this state.'

  semantic_countermodel_guidance:
    version: semantic-countermodel-guidance-v1
    text: 'SAT restart: {{edge}} led to a countermodel ({{assignments}}); choose a different plan from this last valid state.'

  proof_language_view:
    version: proof-language-view-v1
    system: Represent this proof-search state for a frozen embedding model.
    user: |-
      Overall target:
      {{overall_target}}
      Current proof state:
      {{current_state}}
      Accepted tactics:
      {{accepted}}
      Failed tactics:
      {{failed}}

  policy_target_embedding:
    version: policy-target-embedding-v1
    system: Represent the fixed theorem target.
    user: '{{target}}'

  policy_current_embedding:
    version: policy-current-embedding-v1
    system: Represent the current proof need and structural signature.
    user: |-
      {{language_view}}
      Structure:
      {{structure}}

  transition_embedding:
    version: transition-embedding-v1
    system: Represent the change between two proof states.
    user: |-
      Before proof state:
      {{before}}
      After proof state:
      {{after}}

  observed_transition_embedding:
    version: observed-transition-embedding-v1
    system: Represent one verified proof-state transition.
    user: |-
      Before proof state:
      {{before}}
      Verified tactic:
      {{tactic}}
      After proof state:
      {{after}}
