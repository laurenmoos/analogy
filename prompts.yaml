prompts:
  conventional_ranker:
    version: conventional-ranker-v5
    system: >-
      Rank next Lean 4 tactics. JSON only: a nonempty array of objects with exactly `tactic` and `score`.
      Tactics are one-line strings; scores are nonnegative numbers. Use visible identifiers only. Never repeat
      a current-state failure; earlier-state failures are diagnostic context, not a global blacklist.
    user: |-
      Overall target:
      {{overall_target}}
      Current focused Lean proof state:
      {{current_goals}}
      Accepted prefix:
      {{accepted}}
      Recent path failure feedback:
      {{failed}}
      {{tactic_card}}
      Return at most {{top_k}} candidates.

  analogy_conventional_ranker:
    version: analogy-conventional-ranker-v4
    system: >-
      Rank next Lean 4 tactics while maintaining the external working mental model. Return exactly one
      <mental_model> JSON block followed by a nonempty JSON array of objects with exactly `tactic` and `score`.
      Tactics are one-line strings; scores are nonnegative numbers. Use visible identifiers only. Never repeat
      a current-state failure; earlier-state failures are diagnostic context, not a global blacklist.
    user: |-
      Overall target:
      {{overall_target}}
      Current focused Lean proof state:
      {{current_goals}}
      Accepted prefix:
      {{accepted}}
      Recent path failure feedback:
      {{failed}}
      {{tactic_card}}
      Repeat the supplied mental-model block unchanged; ordinary search must not revise its ordered correspondences.
      Then return at most {{top_k}} candidates after the block.

  analogy_initialize:
    version: analogy-initialize-v4
    system: |-
      Explain the supplied Lean proof state through one everyday mental model with an exact structural mapping.
      Use only a source domain from the supplied domain card and only proof tactics from the supplied tactic card.
      Map every visible atomic proposition to one distinct concrete thing and keep that mapping consistent.
      Map every tactic in the proposed plan to one distinct everyday action: one action per tactic and one tactic per action.
      Before planning, look for a shortcut such as an automatically true goal, a reusable hypothesis, or False, and
      make the source-domain story reflect it.
      Ordered domain transitions and proof transitions must have the same causal transition structure.
      The domain fields must not mention Lean, proofs, tactics, logic, mathematics,
      propositions, conjunction, disjunction, or implication. Proof fields may use exact Lean states and tactics.
      Even descriptive words such as "logical" are forbidden in every domain_* value.
      Use the complete supplied proof state as planning input, but keep the returned model to pivotal transitions.
      A proof_before or proof_after must be an exact complete Lean state when supplied; otherwise use JSON null rather than inventing or shortening it.
      A declaration such as p1 : Prop is not evidence;
      never use a proposition name as the operand of exact, apply, or cases. Tactic operands must be visible hypotheses
      from the supplied state or names introduced by an earlier proposed tactic.

      Worked example for a different theorem (`P Q : Prop`, `hP : P`, goal `P ∨ Q`):
      {
        "domain": "travel",
        "correspondences": [
          {
            "domain_before": "a traveler holding a red ticket needs either a red or a blue ticket",
            "domain_transition": "the traveler chooses the red-ticket counter",
            "domain_after": "the red-ticket counter is selected",
            "proof_before": "P Q : Prop\nhP : P\n⊢ P ∨ Q",
            "proof_transition": "left",
            "proof_after": "P Q : Prop\nhP : P\n⊢ P"
          },
          {
            "domain_before": "the red-ticket counter is selected",
            "domain_transition": "the traveler presents the red ticket already in hand",
            "domain_after": "the ticket requirement is satisfied",
            "proof_before": "P Q : Prop\nhP : P\n⊢ P",
            "proof_transition": "exact hP",
            "proof_after": "SOLVED"
          }
        ],
        "abandoned_domains": []
      }
      Use the example only for structural discipline; do not reuse its setting unless the domain card and exclusions permit it.

      Return only one block containing strict JSON in exactly this shape:
      <mental_model>
      {
        "domain": "one-line domain",
        "correspondences": [
          {
            "domain_before": "one-line domain state",
            "domain_transition": "one-line domain action",
            "domain_after": "one-line resulting domain state",
            "proof_before": "known proof state or null",
            "proof_transition": "known or predicted tactic or null",
            "proof_after": "known or predicted proof state or null"
          }
        ],
        "abandoned_domains": []
      }
      </mental_model>
      Keep correspondences ordered. Use JSON null only for genuinely unknown future proof fields. Partial future
      correspondences are allowed, but every proposed proof_transition must come from the tactic card.
    user: |-
      Overall target:
      {{overall_target}}

      Current focused Lean proof state:
      {{current_goals}}

      Allowed source domains:
      {{domain_card}}

      Allowed tactics for this proof state:
      {{tactic_card}}

      Do not use any of these already selected domains:
      {{excluded_domains}}

      Return exactly one block in the required format and no text before or after it.

  analogy_domain_card:
    version: analogy-domain-card-v1
    text: >-
      Everyday-domain card: choose exactly one setting from cooking or restaurant preparation; travel or navigation;
      building, maintenance, or construction; a board, card, or team game; gardening; package delivery or logistics;
      household organization; or mechanical repair involving ordinary physical objects. Use concrete objects, states,
      and causal actions from that setting only. Do not use a mathematical, logical, programming, or proof setting.

  analogy_update:
    version: analogy-update-v4
    system: >-
      Revise the external everyday mental model to escape this stuck Lean 4 proof state, then return the first tactic
      implied by the revision. Preserve its exact structural mapping: distinct proof propositions remain distinct
      concrete things, and each proof tactic remains one distinct everyday action. Use only a source domain from the
      supplied domain card and only proof tactics from the supplied tactic card. Lean is the judge. Return exactly one
      <mental_model> JSON block followed by JSON only.
    user: |-
      Overall target:
      {{overall_target}}

      Current focused Lean proof state:
      {{current_goals}}

      Semantic recovery:
      {{semantic_guidance}}

      Dependency evidence (may be absent):
      {{dependency_table}}

      Accepted prefix:
      {{accepted}}

      OPEN tactics (Lean accepted and left goals):
      {{open_tactics}}

      REJECTED tactics (Lean errors or unusable results):
      {{rejected_tactics}}

      {{tactic_card}}

      Allowed source domains:
      {{domain_card}}

      Choose action revise_model or change_domain. revise_model must preserve the supplied domain while revising
      its ordered transition correspondences. change_domain must choose a new domain not listed under abandoned_domains
      and must select that domain from the supplied domain card before creating a new ordered correspondence list.
      A SAT restart/countermodel requires change_domain.
      The mental-model JSON must contain exactly "domain", "correspondences", and "abandoned_domains". Every
      correspondence must contain "domain_before", "domain_transition", "domain_after", "proof_before",
      "proof_transition", and "proof_after"; use null for unknown proof fields.
      Return the updated <mental_model> block, then JSON with exactly "action", "predicted_state", and "tactic".
      predicted_state is literal SOLVED or the exact full focused Lean state expected immediately after the first tactic.

  lean_tactic_card:
    version: lean-tactic-card-v3
    text: >-
      Lean card: {{recipes}}intro h; exact <hyp>; apply <hyp>; cases <hyp>; constructor; left/right;
      rcases <hyp> with ...; exact False.elim <hyp>; simp; rw [<hyp>]. P : Prop is not evidence; no tauto/itauto.

  lean_tactic_card_recipes:
    version: lean-tactic-card-recipes-v1
    text: 'Destruct/introduce: {{recipes}}. '

  proof_search_history:
    version: proof-search-history-v1
    text: |-
      Proof search history (analogy blocks removed):
      {{history}}

  ranker_json_output_contract:
    version: ranker-json-output-contract-v1
    text: 'Return only the requested JSON array.'

  ranker_analogy_output_contract:
    version: ranker-analogy-output-contract-v2
    text: 'Return the current <mental_model> block unchanged, followed by the requested JSON array.'

  ranker_replacement_repair:
    version: ranker-replacement-repair-v1
    text: |-
      These proposals were removed before Lean:
      - {{discarded}}
      Return replacement candidates only. Do not repeat any removed or already tried tactic. Supply every operand,
      for example `exact h2`, `apply h1`, `rw [h1]`, or `rcases h with ⟨hH,hU⟩`. {{contract}}

  analogy_update_output_contract:
    version: analogy-update-output-contract-v2
    text: >-
      Return one updated <mental_model> JSON block followed by strict JSON with exactly "action", "predicted_state", and "tactic".

  analogy_duplicate_repair:
    version: analogy-duplicate-repair-v1
    text: |-
      The previous tactic was valid but already tried at this proof state. Return a different tactic.

      Tactics already tried here: {{tried_tactics}}

      Duplicate diagnostic:
      {{diagnostic}}

      Previous response (analogy block removed):
      {{previous_response}}

      {{contract}}

  analogy_invalid_repair:
    version: analogy-invalid-repair-v1
    text: |-
      The previous response was invalid.

      Parser diagnostic:
      {{diagnostic}}

      Previous response (analogy block removed):
      {{previous_response}}

      {{contract}}

  analogy_no_change_repair:
    version: analogy-no-change-repair-v1
    text: |-
      The previous response predicted no state change, so it was not sent to Lean. Return a tactic with a different immediate state prediction.

      Tactics already tried here: {{tried_tactics}}

      {{contract}}

  analogy_lean_correction_repair:
    version: analogy-lean-correction-repair-v1
    text: |-
      The previous tactic did not make usable progress.
      Tactic: {{tactic}}
      Lean diagnostic: {{diagnostic}}
      Return a different complete tactic as the required strict JSON object.
      {{contract}}

  analogy_search_correction_repair:
    version: analogy-search-correction-repair-v1
    text: |-
      The previous tactic did not make usable progress.
      Tactic: {{tactic}}
      Search diagnostic: accepted but discarded: {{reason}}
      Return a different complete tactic as the required strict JSON object.
      {{contract}}

  analogy_missing_lean_diagnostic:
    version: analogy-missing-lean-diagnostic-v1
    text: 'Lean rejected the tactic'

  analogy_pending_context:
    version: analogy-pending-context-v2
    text: |-
      <mental_model_pending>
      active: none; change_domain required
      abandoned_domains:
      {{abandoned_domains}}
      </mental_model_pending>

  negation_definition:
    version: negation-definition-v1
    text: '{{prefix}}¬{{body}}  [definitionally: {{body}} → False]'

  semantic_valid_guidance:
    version: semantic-valid-guidance-v1
    text: 'SAT: no countermodel; continue from this state.'

  semantic_countermodel_guidance:
    version: semantic-countermodel-guidance-v1
    text: 'SAT restart: {{edge}} led to a countermodel ({{assignments}}); choose a different plan from this last valid state.'
