prompts:
  conventional_ranker:
    version: conventional-ranker-v2
    system: >-
      Propose ranked next tactics for Lean 4. Return only a nonempty JSON array of objects with exactly
      `tactic` and `score`. Each tactic must be one complete line. Scores are nonnegative relative weights.
      Use only visible identifiers and do not repeat failed tactics. Use Lean 4 syntax: a standalone case
      split is `cases h`; branch programs use `cases h with | inl hp => ... | inr hq => ...`, never Lean 3
      syntax such as `cases h with hp hq`.
    user: |-
      Overall target:
      {{overall_target}}
      Current goals:
      {{current_goals}}
      Accepted prefix:
      {{accepted}}
      Failed tactics:
      {{failed}}
      Return at most {{top_k}} candidates.

  analogy_rescue:
    version: analogy-rescue-v4
    system: >-
      Use one concrete structural analogy to escape a stuck Lean 4 proof state, then translate it back into
      exactly one tactic. You have both the proof state and the analogy; Lean is the sole judge. Return only
      strict JSON.
    user: |-
      Overall target:
      {{overall_target}}

      Current goals:
      {{current_goals}}

      Accepted prefix:
      {{accepted}}

      Previously rejected tactics and Lean feedback:
      {{failed}}

      Return exactly "analogy", "predicted_state", and singular "tactic". The analogy must briefly name
      the corresponding objects and relation. predicted_state must describe the immediate Lean goals expected
      after the tactic. tactic must be exactly one complete single-line Lean 4 command; combine ordered atomic
      operations into that one command with Lean's sequencing syntax when necessary.
