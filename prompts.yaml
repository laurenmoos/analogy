prompts:
  conventional_ranker:
    version: conventional-ranker-v6
    system: >-
      Rank next Lean 4 tactics. JSON only: a nonempty array of objects with exactly `tactic`.
      Tactics are one-line strings. Use visible identifiers only. Never repeat
      a current-state failure; earlier-state failures are diagnostic context, not a global blacklist.
    user: |-
      Overall target:
      {{overall_target}}
      Current focused Lean proof state:
      {{current_goals}}
      Accepted prefix:
      {{accepted}}
      Recent path failure feedback:
      {{failed}}
      {{tactic_card}}
      Return at most {{top_k}} candidates.

  analogy_conventional_ranker:
    version: analogy-conventional-ranker-v5
    system: >-
      Rank next Lean 4 tactics while maintaining the external working mental model. Return exactly one
      <mental_model> JSON block followed by a nonempty JSON array of objects with exactly `tactic`.
      Tactics are one-line strings. Use visible identifiers only. Never repeat
      a current-state failure; earlier-state failures are diagnostic context, not a global blacklist.
    user: |-
      Overall target:
      {{overall_target}}
      Current focused Lean proof state:
      {{current_goals}}
      Accepted prefix:
      {{accepted}}
      Recent path failure feedback:
      {{failed}}
      {{tactic_card}}
      Repeat the supplied mental-model block unchanged; ordinary search must not revise its ordered correspondences.
      Then return at most {{top_k}} candidates after the block.

  analogy_initialize:
    version: analogy-initialize-story-v2
    system: |-
      Write one concrete everyday story whose ordered changes match the supplied abstract action sequence.
      You are not given a formal proof, identifiers, or formal tactics. Do not invent or mention any.
      Use exactly the harness-assigned canonical domain. Write one initial_state and one transition per supplied action.
      Each transition contains only the action and its resulting state; never repeat the preceding state. Domain fields must not mention Lean, proofs,
      tactics, logic, mathematics, propositions, conjunction, disjunction, or implication.

      Example for two abstract actions, “commit to the right available choice” then
      “finish using something already in hand”:
      {
        "domain": "travel",
        "initial_state": "a traveler holding a blue ticket faces a red lane and a blue lane",
        "transitions": [
          {
            "domain_transition": "the traveler enters the blue lane on the right",
            "domain_after": "the traveler stands at the blue-lane checkpoint"
          },
          {
            "domain_transition": "the traveler presents the blue ticket already in hand",
            "domain_after": "the checkpoint opens"
          }
        ],
        "abandoned_domains": []
      }
      Return strict JSON only in exactly this shape:
      {
        "domain": "one-line domain",
        "initial_state": "one-line initial domain state",
        "transitions": [
          {
            "domain_transition": "one-line domain action",
            "domain_after": "one-line resulting domain state"
          }
        ],
        "abandoned_domains": []
      }
    user: |-
      Allowed source domains:
      {{domain_card}}

      Required source domain (use this exact canonical entry):
      {{required_domain}}

      Do not use any of these already selected domains:
      {{excluded_domains}}

      Abstract action sequence (write exactly one transition per line):
      {{abstract_trajectory}}

      Return exactly one JSON object and no text before or after it.

  analogy_initial_tactic:
    version: analogy-initial-tactic-v3
    system: >-
      The validated everyday story describes transitions that have already happened. The current Lean 4 state is
      the proof state after every proof_transition shown in that story. Reason prospectively about the current
      decision rather than merely continuing the pattern of earlier actions. For a disjunction, first translate
      both `left` and `right` into alternative next events in the same everyday situation, describe the resulting
      proof obligation for each, and select the route supported by the visible hypotheses. Never repeat a
      proof_transition merely because it appeared in the history.
      Use visible identifiers only. `left` commits to the left side and makes the left disjunct the goal;
      `right` commits to the right side and makes the right disjunct the goal.
    user: |-
      Overall target:
      {{overall_target}}

      Current focused Lean proof state:
      {{current_goals}}

      Completed everyday history and already-accepted proof transitions:
      {{mental_model}}

      {{tactic_card}}

      If the current goal is a disjunction, return strict JSON with exactly "decision", "tactic", and
      "predicted_state". decision must contain current_everyday_state, options, and selection_reason. options must
      compare both `left` and `right`; every option contains exactly tactic, everyday_consequence, and
      proof_consequence. Otherwise return exactly "tactic" and "predicted_state". predicted_state is SOLVED or
      the exact complete focused Lean state expected immediately after the tactic.

  analogy_recovery_story:
    version: analogy-recovery-story-v3
    system: |-
      Rewrite the everyday story so its completed changes match the supplied current-path abstract action sequence.
      You are not given a formal proof, identifiers, or formal tactics. Do not invent or mention any.
      Use exactly the harness-assigned canonical domain. Return one concrete "initial_state" and one item in
      "transitions" per supplied action. Each transition contains exactly "domain_transition" and "domain_after". Never repeat a previous
      state. Every resulting state must be meaningfully distinct from the state before it.
      Return strict JSON only with exactly "domain", "initial_state", "transitions", and an empty "abandoned_domains" list.
    user: |-
      Required source domain:
      {{required_domain}}

      Abstract actions on the exact current path:
      {{abstract_trajectory}}

      Return the replacement everyday story only. Keep each state and action concrete and concise.
      A one-action example has initial_state = "a cook waiting without an order" and exactly one transition:
      domain_transition = "the cook accepts a new order"; domain_after = "the cook is now responsible for
      preparing that order". Never split one supplied action into multiple transitions.

  analogy_recovery_tactic:
    version: analogy-recovery-tactic-v2
    system: |-
      Solve the current focused Lean goal using only identifiers visible in that state.
      The current goal and visible hypotheses are authoritative. Use the completed everyday history to construct
      a prospective analogy for the current decision: describe what each available route would make happen next,
      then choose the route whose resulting proof obligation is supported. Do not copy an earlier action or invent
      a name from it. You must not select a tactic listed as already attempted.
      `left` commits to the left disjunct and `right` commits to the right disjunct.
    user: |-
      Current focused Lean proof state:
      {{current_goals}}

      Tactics already attempted at this exact state:
      {{tried_tactics}}

      Semantic recovery:
      {{semantic_guidance}}

      Dependency evidence:
      {{dependency_table}}

      {{tactic_card}}

      Selected everyday story (secondary context; it contains no proof identifiers or tactics):
      {{story_model}}

      If the current goal is a disjunction, return strict JSON with exactly "decision", "tactic", and
      "predicted_state". decision must contain current_everyday_state, options, and selection_reason. options must
      compare both `left` and `right`; every option contains exactly tactic, everyday_consequence, and
      proof_consequence. Otherwise return exactly "tactic" and "predicted_state". predicted_state is SOLVED or
      the exact complete focused Lean state expected immediately after the tactic.

  deliberation_plan:
    version: deliberation-plan-v1
    system: |-
      Analyze the current Lean 4 proof state directly. This is a proof-planning control condition:
      do not create or mention an everyday story, analogy, metaphor, or source domain. For a
      disjunction, compare both `left` and `right` and state the resulting proof obligation for
      each. Use only identifiers visible in the current state and do not recommend a tactic already
      attempted at this exact state.
    user: |-
      Overall target:
      {{overall_target}}

      Current focused Lean proof state:
      {{current_goals}}

      Tactics already attempted at this exact state:
      {{tried_tactics}}

      Semantic recovery:
      {{semantic_guidance}}

      Dependency evidence:
      {{dependency_table}}

      {{tactic_card}}

      Return strict JSON only with exactly "analysis", "branches", and "recommended_approach".
      Each branches item contains exactly "tactic" and "resulting_obligation". For a disjunction,
      include both `left` and `right`.

  deliberation_tactic:
    version: deliberation-tactic-v1
    system: |-
      Select one Lean 4 tactic using direct proof reasoning only. The current proof state is
      authoritative. Do not introduce an everyday story, analogy, metaphor, or source domain. Use
      only visible identifiers and never select a tactic already attempted at this exact state.
    user: |-
      Current focused Lean proof state:
      {{current_goals}}

      Tactics already attempted at this exact state:
      {{tried_tactics}}

      Semantic recovery:
      {{semantic_guidance}}

      Dependency evidence:
      {{dependency_table}}

      {{tactic_card}}

      Direct proof plan:
      {{direct_plan}}

      If the goal is a disjunction, return strict JSON with exactly "decision", "tactic", and
      "predicted_state". decision contains exactly "current_proof_situation", "options", and
      "selection_reason". Each option contains exactly "tactic" and "resulting_obligation", and
      options must compare both `left` and `right`. Otherwise return exactly "tactic" and
      "predicted_state". predicted_state is SOLVED or the exact focused state after the tactic.

  deliberation_invalid_repair:
    version: deliberation-invalid-repair-v1
    text: |-
      Your direct proof plan was rejected: {{diagnostic}}
      Previous response:
      {{previous_response}}
      Return one corrected strict JSON plan matching the requested schema. Do not use an analogy.

  analogy_domain_card:
    version: analogy-domain-card-v2
    text: |-
      Everyday-domain card: each line is one canonical domain.
      - cooking or restaurant preparation
      - travel or navigation
      - building, maintenance, or construction
      - board, card, or team game
      - gardening
      - package delivery or logistics
      - household organization
      - mechanical repair
      Use concrete physical objects, states, and causal actions only. Do not use a mathematical, logical, programming, or proof setting.

  analogy_update:
    version: analogy-update-v4
    system: >-
      Revise the external everyday mental model to escape this stuck Lean 4 proof state, then return the first tactic
      implied by the revision. Preserve its exact structural mapping: distinct proof propositions remain distinct
      concrete things, and each proof tactic remains one distinct everyday action. Use only a source domain from the
      supplied domain card and only proof tactics from the supplied tactic card. Lean is the judge. Return exactly one
      <mental_model> JSON block followed by JSON only.
    user: |-
      Overall target:
      {{overall_target}}

      Current focused Lean proof state:
      {{current_goals}}

      Semantic recovery:
      {{semantic_guidance}}

      Dependency evidence (may be absent):
      {{dependency_table}}

      Accepted prefix:
      {{accepted}}

      OPEN tactics (Lean accepted and left goals):
      {{open_tactics}}

      REJECTED tactics (Lean errors or unusable results):
      {{rejected_tactics}}

      {{tactic_card}}

      Allowed source domains:
      {{domain_card}}

      Harness-assigned source domain:
      {{required_domain}}

      Choose action revise_model or change_domain. revise_model must preserve the supplied domain while revising
      its ordered transition correspondences. For change_domain, use exactly the harness-assigned source domain;
      never choose a domain yourself. A SAT restart/countermodel requires change_domain.
      The mental-model JSON must contain exactly "domain", "correspondences", and "abandoned_domains". Every
      correspondence must contain "domain_before", "domain_transition", "domain_after", and "proof_transition".
      Never include proof_before or proof_after. The harness owns all proof states and the domain ledger,
      so always return an empty abandoned_domains list; the harness will fill it after validation.
      Return the updated <mental_model> block, then JSON with exactly "action", "predicted_state", and "tactic".
      predicted_state is literal SOLVED or the exact full focused Lean state expected immediately after the first tactic.

  lean_tactic_card:
    version: lean-tactic-card-v5
    text: >-
      Lean card: {{recipes}}intro h; exact <hyp>; apply <hyp>; constructor; left/right;
      left = commit to the left side, so the goal becomes the left disjunct; right = commit to the right side,
      so the goal becomes the right disjunct; rcases <hyp> with ...; exact False.elim <hyp>; simp; rw [<hyp>].
      P : Prop is not evidence; no tauto/itauto.

  lean_tactic_card_recipes:
    version: lean-tactic-card-recipes-v1
    text: 'Destruct/introduce: {{recipes}}. '

  proof_search_history:
    version: proof-search-history-v1
    text: |-
      Proof search history (analogy blocks removed):
      {{history}}

  ranker_json_output_contract:
    version: ranker-json-output-contract-v1
    text: 'Return only the requested JSON array.'

  ranker_analogy_output_contract:
    version: ranker-analogy-output-contract-v2
    text: 'Return the current <mental_model> block unchanged, followed by the requested JSON array.'

  ranker_replacement_repair:
    version: ranker-replacement-repair-v1
    text: |-
      These proposals were removed before Lean:
      - {{discarded}}
      Return replacement candidates only. Do not repeat any removed or already tried tactic. Supply every operand,
      for example `exact h2`, `apply h1`, `rw [h1]`, or `rcases h with ⟨hH,hU⟩`. {{contract}}

  analogy_update_output_contract:
    version: analogy-update-output-contract-v2
    text: >-
      Return one updated <mental_model> JSON block followed by strict JSON with exactly "action", "predicted_state", and "tactic".

  analogy_duplicate_repair:
    version: analogy-duplicate-repair-v1
    text: |-
      The previous tactic was valid but already tried at this proof state. Return a different tactic.

      Tactics already tried here: {{tried_tactics}}

      Duplicate diagnostic:
      {{diagnostic}}

      Previous response (analogy block removed):
      {{previous_response}}

      {{contract}}

  analogy_invalid_repair:
    version: analogy-invalid-repair-v2
    text: |-
      Rejected: {{diagnostic}}
      Current domain: {{current_domain}}
      Required domain: {{required_domain}}
      Correct the rejection and choose no other domain.

      Previous response (analogy block removed):
      {{previous_response}}

      {{contract}}

  analogy_no_change_repair:
    version: analogy-no-change-repair-v1
    text: |-
      The previous response predicted no state change, so it was not sent to Lean. Return a tactic with a different immediate state prediction.

      Tactics already tried here: {{tried_tactics}}

      {{contract}}

  analogy_lean_correction_repair:
    version: analogy-lean-correction-repair-v1
    text: |-
      The previous tactic did not make usable progress.
      Tactic: {{tactic}}
      Lean diagnostic: {{diagnostic}}
      Return a different complete tactic as the required strict JSON object.
      {{contract}}

  analogy_search_correction_repair:
    version: analogy-search-correction-repair-v1
    text: |-
      The previous tactic did not make usable progress.
      Tactic: {{tactic}}
      Search diagnostic: accepted but discarded: {{reason}}
      Return a different complete tactic as the required strict JSON object.
      {{contract}}

  analogy_missing_lean_diagnostic:
    version: analogy-missing-lean-diagnostic-v1
    text: 'Lean rejected the tactic'

  analogy_pending_context:
    version: analogy-pending-context-v3
    text: |-
      <mental_model_pending>
      active: none; change_domain required
      assigned_domain: {{assigned_domain}}
      abandoned_domains:
      {{abandoned_domains}}
      </mental_model_pending>

  negation_definition:
    version: negation-definition-v1
    text: '{{prefix}}¬{{body}}  [definitionally: {{body}} → False]'

  semantic_valid_guidance:
    version: semantic-valid-guidance-v1
    text: 'SAT: no countermodel; continue from this state.'

  semantic_countermodel_guidance:
    version: semantic-countermodel-guidance-v1
    text: 'SAT restart: {{edge}} led to a countermodel ({{assignments}}); choose a different plan from this last valid state.'
