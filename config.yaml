prompts:
  path: prompts.yaml

model:
  backend: mlx
  name: mlx-community/Qwen3-8B-4bit
  device: mps
  hidden_layer: -1
  max_new_tokens: 512
  timeout_seconds: 45.0
  do_sample: true
  temperature: 0.7
  top_p: 0.9

benchmark:
  corpus: src/analogy/lean_gym/corpus/problems.json
  selection: exhaustive

search:
  top_k: 3
  max_steps: 32
  stuck_after: 2

analogy:
  enabled: true
  max_model_calls: 3

run:
  output_dir: .artifacts/runs
